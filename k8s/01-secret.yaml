# Credenciales de la base.
#
# QUE ES (Y QUE NO ES) UN SECRET
# Un Secret NO esta cifrado: Kubernetes lo guarda en etcd codificado en base64,
# que es codificacion, no encriptacion (cualquiera con permiso de lectura sobre el
# namespace lo puede decodificar con un comando). Lo que si aporta frente a un
# ConfigMap es que se puede controlar por separado con RBAC, que no aparece en los
# "kubectl describe" y que deja explicito en el manifiesto que ese dato es
# sensible.
#
# En un proyecto real la contraseña no se sube al repositorio: se usa un gestor
# externo (Sealed Secrets, External Secrets, Vault) o se crea a mano en el cluster
# con "kubectl create secret". Aca va en el repo a proposito, para que el trabajo
# sea reproducible con un solo comando, y por eso es una contraseña de juguete que
# no protege nada real.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credenciales
  namespace: statuspage
type: Opaque
stringData:
  # stringData recibe el valor en texto plano y Kubernetes lo codifica solo.
  # Es mas legible que pegar el base64 a mano y menos propenso a errores.
  POSTGRES_PASSWORD: statuspage-demo
